[project]
name = "acp"
version = "0.1.0"
description = "See and sync agent skills, agents and hooks across your projects, for Claude Code and Codex."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.2,<3"]

[project.scripts]
acp = "acp.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acp"]

[tool.hatch.build.targets.wheel.force-include]
"site" = "acp/web/guide"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
